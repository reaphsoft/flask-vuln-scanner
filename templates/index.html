<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Vulnerability Scanner</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        label, select, input, button {
            display: block;
            width: 100%;
            margin-bottom: 15px;
        }
        #scan_output {
            white-space: pre-wrap;
            background-color: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 6px;
            min-height: 150px;
            margin-top: 20px;
            overflow-y: auto;
        }
        .links {
            margin-top: 20px;
        }
        .links a {
            margin-right: 15px;
            text-decoration: none;
            color: #007BFF;
        }
        .btn {
            background-color: #007BFF;
            color: white;
            padding: 10px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Vulnerability Scanner</h2>
        <form id="scanForm">
            <label for="target">Target URL or IP:</label>
            <input type="text" id="target" name="target" required>

            <label for="scan_type">Scan Type:</label>
            <select id="scan_type" name="scan_type">
                <option value="basic">Basic</option>
                <option value="fast">Fast</option>
                <option value="deep">Deep</option>
            </select>

            <label for="port_range">Port Range (e.g. 80,443,8000-8100):</label>
            <input type="text" id="port_range" name="port_range" placeholder="1-65535" value="1-65535">

            <button type="submit" class="btn">Start Scan</button>
        </form>

        <div class="links">
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="/scan_history" class="btn">View Scan History</a>
            <a href="/update_nvd" class="btn">Update NVD Dataset</a>
        </div>

        <div id="scan_output"></div>
    </div>

    <script>
        const form = document.getElementById("scanForm");
        const outputDiv = document.getElementById("scan_output");

        form.addEventListener("submit", function(e) {
            e.preventDefault();
            const target = document.getElementById("target").value;
            const scanType = document.getElementById("scan_type").value;
            const portRange = document.getElementById("port_range").value;

            outputDiv.innerHTML = "Starting scan...\n";

            fetch(`/scan_stream?target=${encodeURIComponent(target)}&scan_type=${scanType}&port_range=${encodeURIComponent(portRange)}`)
                .then(response => {
                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();

                    function read() {
                        reader.read().then(({ done, value }) => {
                            if (done) return;
                            outputDiv.innerHTML += decoder.decode(value);
                            outputDiv.scrollTop = outputDiv.scrollHeight;
                            read();
                        });
                    }

                    read();
                })
                .catch(error => {
                    outputDiv.innerHTML += `\nError: ${error}`;
                });
        });
    </script>
</body>
</html>


























<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vulnerability Scanner</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    #output {
      white-space: pre-wrap;
      background: #f8f9fa;
      padding: 10px;
      border: 1px solid #ccc;
      max-height: 400px;
      overflow-y: scroll;
      margin-top: 15px;
    }
  </style>
</head>
<body class="container mt-5">
  <h1>🔍 Vulnerability Scanner</h1>
  <form id="scanForm">
    <div class="mb-3">
      <label for="target" class="form-label">Target IP or Domain</label>
      <input type="text" class="form-control" name="target" required>
    </div>
    <div class="mb-3">
      <label for="scanType" class="form-label">Scan Type</label>
      <select class="form-select" name="scanType" required>
        <option value="basic">Basic</option>
        <option value="fast">Fast</option>
        <option value="deep">Deep</option>
      </select>
    </div>
    <div class="mb-3">
      <label for="portRange" class="form-label">Port Range (default 1-65535)</label>
      <input type="text" class="form-control" name="portRange" placeholder="1-65535">
    </div>
    <button type="submit" class="btn btn-primary">Start Scan</button>
  </form>

  <div id="output" class="mt-4"></div>

  <hr>
  <h4>📁 Download Previous Scan Report</h4>
  <form id="downloadForm">
    <div class="mb-3">
      <label for="scan_id" class="form-label">Scan ID</label>
      <input type="number" class="form-control" name="scan_id" required>
    </div>
    <button type="button" class="btn btn-outline-secondary me-2" onclick="downloadReport('txt')">Download TXT</button>
    <button type="button" class="btn btn-outline-secondary me-2" onclick="downloadReport('csv')">Download CSV</button>
    <button type="button" class="btn btn-outline-secondary" onclick="downloadReport('pdf')">Download PDF</button>
  </form>

  <script>
    document.getElementById('scanForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const formData = new FormData(e.target);
      document.getElementById('output').textContent = "Starting scan...\n";

      fetch('/scan_stream', {
        method: 'POST',
        body: formData
      })
      .then(response => {
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let output = '';

        function readChunk() {
          reader.read().then(({ done, value }) => {
            if (done) return;
            output += decoder.decode(value);
            document.getElementById('output').textContent = output;
            readChunk();
          });
        }

        readChunk();
      });
    });

    function downloadReport(format) {
      const id = document.querySelector('[name="scan_id"]').value;
      if (!id) {
        alert("Please enter a valid scan ID.");
        return;
      }
      window.location.href = `/download/${id}/${format}`;
    }
  </script>
</body>
</html>
